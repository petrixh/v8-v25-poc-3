# CI of the migration (.github/CI.md): build the UI path on Java 21 and Vaadin 25, start one isolated copy, smoke-log-in
# every test user, run the test suite. One job, so the build is never passed between jobs through artifact storage;
# diagnostics are uploaded only on failure (a step over its time limit is a failure). In parallel, the job e2e builds
# and starts its own copy and runs the UI end-to-end tests (env/e2e.sh). Downloads only from Maven Central, nodejs.org
# (Node for the frontend build), the npm registry, official Docker Hub images and the Playwright browser download.
# Runs once per commit: no pull_request trigger (the checks of a push show on its PR), and the first job ends the run
# at once, as a success, when the commit already has a successful run of this workflow (.github/CI.md "When it runs").
name: CI

on:
  push:
    branches: [main, mig-dev, 'stage/**', 'stabilise/**', 'fix/**']
  workflow_dispatch:
    inputs:
      force:
        description: Run even if this commit already has a successful run of CI
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: 1.63.0
  # one env copy (env/README.md); the UI on 127.0.0.1:18081
  APP_ENV_PROJECT: ci
  APP_ENV_PORT: '18081'
  APP_ENV_USERS_PROPERTIES: /home/runner/.config/mig-ci/test-users.properties
  APP_ENV_USERS_ENV: /home/runner/.config/mig-ci/test-users.env
  APP_ENV_MAVEN_REPO: /home/runner/.m2/repository
  # Node (Vaadin's frontend build) and the npm cache, kept between runs
  APP_ENV_BUILD_HOME: /home/runner/.cache/mig-env-build-home
  CI_OUT: /home/runner/ci-out
  # build logs and the logs env/down.sh saves (app, DNS), next to the step output for the diagnostics upload
  APP_ENV_LOG_DIR: /home/runner/ci-out/env-logs

jobs:
  already-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # the only job with this permission; it reads run metadata of this repository with the job's own token
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Has this commit a successful CI run already
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          skip=false
          if [ "$FORCE" = true ]; then
            echo "force was set: running"
          else
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq .total_count)
            if [ "$n" -gt 0 ]; then
              skip=true
              echo "::notice::Commit $GITHUB_SHA already has a successful CI run: skipping. Run the workflow by hand with force to run it again."
            else
              echo "no successful run of this commit yet: running"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build-test-smoke:
    needs: already-green
    if: ${{ needs.already-green.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash  # -eo pipefail
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Restore Node and npm cache of the frontend build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/mig-env-build-home
          key: build-home-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: build-home-${{ runner.os }}-

      - name: Restore Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Test users (throw-away, random passwords)
        run: .github/ci/test-users.sh /home/runner/.config/mig-ci

      - name: Build and start (env/up.sh)
        id: up
        timeout-minutes: 20
        # Maven package of -pl hawkbit-vv8-ui,hawkbit-mgmt-server -am in Docker (JDK 21) with env/maven-settings.xml and
        # -DskipNexusStaging; fails if Maven or the frontend build downloaded from any host but repo.maven.apache.org,
        # nodejs.org and registry.npmjs.org. Then one copy on an internal Docker network, seeded, UI at 127.0.0.1:18081.
        run: |
          mkdir -p "$CI_OUT"
          env/up.sh 2>&1 | tee "$CI_OUT/up.log"

      - name: Install Playwright
        timeout-minutes: 5
        run: |
          npm install --no-save --no-audit --no-fund --prefix /home/runner/pw "playwright@$PLAYWRIGHT_VERSION"
          /home/runner/pw/node_modules/.bin/playwright install --only-shell chromium

      - name: Smoke (log in every test user, open their views; non-app hosts blocked)
        timeout-minutes: 10
        env:
          PW: /home/runner/pw/node_modules/playwright
        run: node .github/ci/smoke/smoke.cjs .github/ci/smoke/new-app.json "http://127.0.0.1:$APP_ENV_PORT" "$CI_OUT/smoke"

      - name: Tests (vv8-ui path, offline, with RabbitMQ)
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        timeout-minutes: 20
        run: .github/ci/run-tests.sh "$CI_OUT/tests"

      - name: Stop (env/down.sh)
        if: ${{ always() }}
        run: env/down.sh

      - name: Summary
        if: ${{ always() }}
        continue-on-error: true
        run: .github/ci/summary.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics (failure only)
        # failure() includes a step over its timeout-minutes; the step limits add up to under the job's 60 minutes, so
        # a hung step still gets its diagnostics. A run cancelled by a newer push uploads nothing.
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            /home/runner/ci-out/
            **/target/surefire-reports/*.txt
            **/target/failsafe-reports/*.txt

  e2e:
    # End-to-end tests of the UI (env/README.md "End-to-end tests"): env/e2e.sh builds the image, starts one copy, runs
    # mvn -Pe2e verify (Playwright for Java, Chromium headless shell) against it and removes it. Own job, in parallel
    # with build-test-smoke, so it builds the image itself (no build passed between jobs); skipped like it.
    needs: already-green
    if: ${{ needs.already-green.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash  # -eo pipefail
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.m2/repository
          # own key: this repository also holds Playwright for Java; seeded from build-test-smoke's on a miss
          key: maven-e2e-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-e2e-${{ runner.os }}-
            maven-${{ runner.os }}-

      - name: Restore Node and npm cache of the frontend build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/mig-env-build-home
          key: build-home-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: build-home-${{ runner.os }}-

      - name: Restore Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # the same Chromium headless shell the smoke installs (Playwright for Java has the smoke's version)
          path: /home/runner/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Test users (throw-away, random passwords)
        run: .github/ci/test-users.sh /home/runner/.config/mig-ci

      - name: End-to-end tests (env/e2e.sh)
        timeout-minutes: 35
        # The runner's JDK 21 and Maven 3.9 run the tests; the app image is built in Docker as in build-test-smoke.
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          mkdir -p "$CI_OUT"
          mvn -v
          env/e2e.sh 2>&1 | tee "$CI_OUT/e2e.log"

      - name: Upload diagnostics (failure only)
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            /home/runner/ci-out/
            hawkbit-runtime/hawkbit-vv8-ui-e2e/target/e2e/
            hawkbit-runtime/hawkbit-vv8-ui-e2e/target/failsafe-reports/
